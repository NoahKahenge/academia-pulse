        /* Global Design System */
        :root {

        .glass-panel {

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        .glass-panel-dark {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Scrollbar Hide */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animations */
        @keyframes modal-pop {
            0% { 
                transform: scale(0.95) translateY(10px); 
                opacity: 0; 
            }
            100% { 
                transform: scale(1) translateY(0); 
                opacity: 1; 
            }
        }

        @keyframes slide-in {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(79, 70, 229, 0.2); }
        }

        .animate-modal-pop {
            animation: modal-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-slide-in {
            animation: slide-in 0.3s ease-out forwards;
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }

        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Database Connection Status */
        .db-connected {
            position: relative;
        }
        .db-connected::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Loading Spinner */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(79, 70, 229, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
            transition: all 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Print Styles */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .glass-panel {
                background: rgba(255, 255, 255, 0.95);
            }
        }
    </style>

    <!-- Database Connection Check Script -->
    <script>
        // Pre-flight database connection test
        window.testDatabaseConnection = async () => {
            try {
                const response = await fetch('/api/health', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Database connection healthy:', data);
                    return { connected: true, ...data };
                }
                return { connected: false, error: 'Health check failed' };
            } catch (error) {
                console.warn('⚠️ Database health check failed:', error.message);
                return { connected: false, error: error.message };
            }
        };

        // Execute on load
        window.addEventListener('DOMContentLoaded', () => {
            window.testDatabaseConnection().then(status => {
                window.__DB_STATUS__ = status;
                
                // Dispatch event for React app
                window.dispatchEvent(new CustomEvent('db-status', { detail: status }));
                
                if (status.connected) {
                    console.log(`📊 Connected to ${window.__ENV__.DB_NAME} successfully`);
                }
            });
        });
    </script>

    <!-- React Entry Point (no stray /index.tsx script) -->
    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import App from './App.tsx';

        // Hide initial loading indicator when React is ready
        const hideInitialLoading = () => {
            const loadingEl = document.getElementById('initial-loading');
            const dbIndicator = document.getElementById('db-init-indicator');
            
            if (loadingEl) {
                loadingEl.style.opacity = '0';
                setTimeout(() => {
                    loadingEl.style.display = 'none';
                }, 500);
            }
            
            if (dbIndicator) {
                dbIndicator.style.opacity = '0';
                setTimeout(() => {
                    dbIndicator.style.display = 'none';
                }, 500);
            }
        };

        // Initialize React with database context
        const container = document.getElementById('root');
        
        if (container) {
            // Clear the loading placeholder
            while (container.firstChild) {
                if (container.firstChild.id === 'initial-loading') {
                    break; // Keep the loading indicator
                }
                container.removeChild(container.firstChild);
            }
            
            try {
                const root = createRoot(container);
                
                // Render App with database configuration
                root.render(
                    React.createElement(
                        React.StrictMode,
                        null,
                        React.createElement(App, {
                            dbConfig: {
                                host: window.__ENV__.DB_HOST,
                                port: window.__ENV__.DB_PORT,
                                database: window.__ENV__.DB_NAME,
                                user: window.__ENV__.DB_USER,
                                password: window.__ENV__.DB_PASSWORD,
                                charset: 'utf8mb4'
                            },
                            onReady: hideInitialLoading
                        })
                    )
                );
                
                console.log('⚛️ React mounted with database:', window.__ENV__.DB_NAME);
            } catch (error) {
                console.error('❌ Failed to initialize React:', error);
                
                // Show error in UI
                container.innerHTML = `
                    <div class="fixed inset-0 flex items-center justify-center bg-slate-50 p-6">
                        <div class="max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center border border-red-100">
                            <div class="w-20 h-20 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                <i class="fa-solid fa-circle-exclamation text-4xl text-red-600"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-800 mb-3">Application Error</h2>
                            <p class="text-slate-600 mb-6">${error.message || 'Failed to initialize the application'}</p>
                            <button onclick="window.location.reload()" 
                                class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors">
                                <i class="fa-solid fa-rotate-right mr-2"></i>
                                Reload Application
                            </button>
                        </div>
                    </div>
                `;
                hideInitialLoading();
            }
        }
    </script>
    
    <!-- Database Connection Monitor (Optional, for debugging) -->
    <script>
        window.addEventListener('db-status', (e) => {
            const status = e.detail;
            const indicator = document.getElementById('db-init-indicator');
            
            if (indicator) {
                if (status.connected) {
                    indicator.innerHTML = `
                        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-medium text-slate-600">u610315472_ap_master • connected</span>
                    `;
                    indicator.classList.add('db-connected');
                    
                    setTimeout(() => {
                        indicator.style.opacity = '0';
                        setTimeout(() => indicator.style.display = 'none', 300);
                    }, 2000);
                } else {
                    indicator.innerHTML = `
                        <div class="w-2 h-2 bg-amber-500 rounded-full"></div>
                        <span class="text-xs font-medium text-slate-600">Database connection failed</span>
                    `;
                }
            }
        });
    </script>
